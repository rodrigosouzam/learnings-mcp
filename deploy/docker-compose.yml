# Shared Postgres + pgvector for TEAM MODE.
#   docker compose -f deploy/docker-compose.yml up -d
# Then point the MCP server at it:
#   LEARNINGS_DB_URL=postgresql://learnings:change-me@localhost:5432/learnings
# The PgStore auto-creates the schema on first connect (see deploy/schema.sql for reference).
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: learnings
      POSTGRES_USER: learnings
      POSTGRES_PASSWORD: change-me   # change this; use a secret in real deployments
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U learnings -d learnings"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
